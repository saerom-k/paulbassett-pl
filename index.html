<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --surface-2:#FAFAFA; --surface-3:#F2F2F3;
  --border:#E7E7E9; --border-soft:#F0F0F1;
  --text:#17171A; --text-dim:#58585F; --text-mute:#9A9AA0;
  --accent:#E4002B; --accent-soft:#FFE9EC; --accent-ink:#ffffff;
  --rise:#1656D1; --neg:#E4002B; --info:#1E3A8A; --info-soft:#EDF1FB;
  --s26:#1656D1; --s25:#C9C9CE; --plan:#58585F;
  --c1:#1656D1; --c2:#E4002B; --c3:#0E9F5A; --c4:#E08A00;
  --shadow:0 1px 2px rgba(20,20,25,.04),0 6px 20px rgba(20,20,25,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--accent);color:#fff}
.hide{display:none!important}
/* gate */
#gate{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:14vh 20px 24px}
.gate-card{width:100%;max-width:440px;background:transparent;border:0;padding:0;box-shadow:none;text-align:center}
.brand-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px}
.brand-t{font-size:.72rem;font-weight:800;letter-spacing:.14em;color:var(--accent)}
.brand-mark{width:13px;height:32px;border-radius:4px;background:var(--accent);flex-shrink:0}
.gate-card h1{font-size:1.4rem;margin:0 0 10px;font-weight:800;letter-spacing:-.02em}
.gate-card p{margin:0 0 20px;color:var(--text-dim);font-size:.88rem}
.pwwrap{position:relative}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:1.05rem;color:var(--text-mute);cursor:pointer;padding:6px}
.gdiv{border:0;border-top:1px solid var(--border);margin:24px 0 16px}
.gate-card input[type=password],.gate-card input#pw{width:100%;height:50px;border:2px solid var(--border);border-radius:12px;padding:0 44px 0 16px;background:#fff;font-size:16px}
.gate-card input[type=password]:focus{outline:none;border-color:var(--accent)}
.gate-card .row{display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 0 6px;color:var(--text-dim);font-size:.82rem}
.btn{width:100%;height:50px;border:0;border-radius:12px;margin-top:10px;background:var(--accent);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
.err{color:var(--neg);font-size:.82rem;min-height:18px;margin-top:8px}
/* shell */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;border-bottom:1px solid var(--border)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top-r{display:flex;align-items:center;gap:8px;flex:none}
.sbtn{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1.5px solid #2a2a2f;border-radius:19px;background:#f6f6f8;cursor:pointer;font-weight:600}
.sbtn em{display:none;font-style:normal;font-size:.82rem;color:var(--text-dim)}
.sbtn:hover{border-color:var(--accent);background:#fff0f2}
@media (min-width:700px){.sbtn{min-width:270px}.sbtn em{display:inline}}
#srch{position:fixed;inset:0;z-index:70}
#srch .sbd{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#srch .spn{position:absolute;left:50%;top:0;transform:translateX(-50%);width:min(640px,100%);max-height:100vh;background:#fff;display:flex;flex-direction:column;border-radius:0 0 18px 18px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
@media (min-width:700px){#srch .spn{top:8vh;border-radius:18px;max-height:80vh}}
.sbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.sbar input{flex:1;min-width:0;height:44px;border:2px solid #2a2a2f;border-radius:12px;padding:0 14px;font-size:16px;background:#fff;-webkit-appearance:none}
.sbar input:focus{outline:none;border-color:var(--accent)}
#sres{overflow:auto;padding:6px 8px 14px}
.sg{font-size:.7rem;font-weight:800;color:var(--text-mute);padding:10px 8px 4px;letter-spacing:.04em}
.sit{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 8px;border-radius:10px;cursor:pointer;border-bottom:1px dashed #e3e3e8}
.sit:hover,.sit.on{background:#fff0f2}

/* ---------- crypto gate ---------- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pass){
  pass=String(pass).trim().toLowerCase();
  const raw=b64(PAYLOAD),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  if(typeof DecompressionStream==='undefined'){const e=new Error('nogz');e.code='nogz';throw e}
  const txt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}

async function tryOpen(pass,remember){

}

function dlx(v,pv,goodUp,rateOnly,stack){
  if(!pv) return '<span class="nu">-</span>';
  const d=v-pv,r=pv>0?d/pv:null,good=goodUp?d>0:d<0;
  const c=Math.round(d)===0?'nu':(good?'up':'dn');
  const ar=Math.round(d)>0?'▲':Math.round(d)<0?'▼':'';
  if(stack) return `<span class="${c}">${ar} ${r==null?'-':pcs(r)}</span><span class="s2">(${fs(d)})</span>`;
  return `<span class="${c}">${ar} ${r==null?'-':pcs(r)}${rateOnly?'':` (${fs(d)})`}</span>`;
}
function dpp(a,b,goodUp){
  if(a==null||b==null)return '';const d=a-b,good=goodUp?d>0:d<0;
  return `<span class="${Math.abs(d)<0.0005?'nu':(good?'up':'dn')}">${pp(d)}</span>`;
}
function dpa(r,pr,v,pv,goodUp,stack){
  if(!D.meta.hasPrev||r==null||pr==null) return '<span class="nu">-</span>';
  const d=r-pr,da=v-pv,good=goodUp?d>0:d<0,flat=Math.abs(d)<0.0005;
  const c=flat?'nu':(good?'up':'dn'),ar=flat?'':(d>0?'▲':'▼');
  const a=`(${fs(da)}백만)`;
  return stack?`<span class="${c}">${ar} ${pp(d)}</span><span class="s2">${a}</span>`:`<span class="${c}">${ar} ${pp(d)} ${a}</span>`;
}

function comp(ixo){
  const ix=ixo||idx(),c=D.company,o={};
  for(const k of ['rev','cogs','labor','mfg','rent','dep','op1','alloc','op2','ebitda1','ebitda2']){o[k]=sum(c.y26[k],ix);o['p'+k]=sum(c.y25[k],ix);}
  o.ac=c.y26.ac.map(a=>sum(a,ix));o.pac=c.y25.ac.map(a=>sum(a,ix));o.waste=o.ac[WI];o.pwaste=o.pac[WI];
  for(const k of ['rev','cogs','labor','op1','op2','ebitda1','ebitda2']) o['plan_'+k]=sum(c.plan[k],ix);
  return o;
}
function sfig(s,ixo,py){
  const ix=ixo||idx(),o={},R=py?s.r25:s.r26;
  for(const k of ['rev','cogs','labor','mfg','rent','dep','op1','alloc','op2','ebitda1','ebitda2']) {o[k]=sum(R[k],ix);o['p'+k]=sum(s.r25[k],ix);}
  o.ac=R.ac.map(a=>sum(a,ix));o.pac=s.r25.ac.map(a=>sum(a,ix));o.waste=o.ac[WI];o.pwaste=o.pac[WI];
  for(const k of ['rev','cogs','labor','op1','op2','ebitda2']) o['plan_'+k]=sum(s.plan[k],ix);

}
function sumFig(list){
  if(!list.length) return null;
  const o={},k0=list[0].f;
  for(const k in k0){
    if(Array.isArray(k0[k])) o[k]=k0[k].map((_,i)=>list.reduce((s,x)=>s+(x.f[k][i]||0),0));
    else o[k]=list.reduce((s,x)=>s+(x.f[k]||0),0);
  }
  return o;
}

function chart(el,o){
  // bars:[{name,color,negColor,vals,w,label?(i),tip?(i)}]  lines:[{name,color,vals,dash,width,label?(i),above?}]
  const H=o.h||230,pr=10,pt=14,pb=24;
  const all=[];o.bars.forEach(b=>{if(!b.prev)b.vals.forEach(v=>v!=null&&all.push(v))});(o.lines||[]).forEach(b=>b.vals.forEach(v=>v!=null&&all.push(v)));
  if(o.bars.some(b=>b.prev)){const lo=Math.min(...all,0),hi=Math.max(...all,0),lim=(hi-lo)||1;o.bars.forEach(b=>{if(b.prev)b.vals.forEach(v=>{if(v!=null&&v>=lo-lim&&v<=hi+lim)all.push(v)})})}
  let mx=Math.max(...all,o.nozero?-1e18:0),mn=Math.min(...all,o.nozero?1e18:0); if(!isFinite(mx)){mx=1;mn=0} if(mx===mn)mx=mn+1;
  if(o.nozero){const pad=(mx-mn)*.18;mx+=pad;mn-=pad;}
  const nice=x=>{const p=Math.pow(10,Math.floor(Math.log10(Math.abs(x)||1)));const n=x/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p};
  const span=nice((mx-mn)/4); let top=Math.ceil(mx/span)*span,bot=Math.floor(mn/span)*span; if(top===bot)top+=span;
  const axf=o.axis||fmI;

  const n=o.labels.length,nb=o.bars.length,gap=2;
  const avail=(el.clientWidth||340);
  let ws=o.bars.map(b=>b.w||18),grp=ws.reduce((a,b)=>a+b,0)+Math.max(0,nb-1)*gap;
  const fitStep=(avail-pl-pr)/n;
  if(nb&&n<=12&&fitStep<grp+8){const k=Math.max(.4,(fitStep-6)/grp);ws=ws.map(w=>Math.max(5,w*k));grp=ws.reduce((a,b)=>a+b,0)+Math.max(0,nb-1)*gap;}
  const minStep=nb?Math.min(grp+8,n<=12?fitStep:1e9):Math.min(o.minStep||0,n<=12?fitStep:1e9);
  const W=Math.max(avail,pl+pr+n*minStep);
  const iw=W-pl-pr,ih=H-pt-pb,step=iw/n;
  const y=v=>pt+ih*(1-(v-bot)/(top-bot)),x=i=>pl+step*(i+.5);
  const mute=cssv('--text-mute'),line=cssv('--border'),ink=cssv('--text');
  let g='';

  o.labels.forEach((l,i)=>{g+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle" font-size="${step<28?10:11}" fill="${mute}">${step<28?String(l).replace('월',''):l}</text>`});
  let lab='';
  const y0=y(Math.max(bot,Math.min(0,top)));

    const off=ws.slice(0,bi).reduce((a,c)=>a+c+gap,0),bw=ws[bi];
    const vc=b.prev?Math.max(bot,Math.min(top,v)):v,cut=b.prev&&vc!==v;
    const x0=x(i)-grp/2+off,yt=Math.min(y(vc),y0),h=Math.max(1,Math.abs(y(vc)-y0));
    if(cut)lab+=`<text x="${x(i)-grp/2+off+bw/2}" y="${v>vc?yt+9:yt+h-3}" text-anchor="middle" font-size="9" fill="${mute}" font-weight="700">${v>vc?'▲':'▼'}</text>`;
    const col=(b.negColor&&v<0)?b.negColor:b.color;
    g+=`<rect x="${x0}" y="${yt}" width="${bw}" height="${h}" rx="${Math.min(4,bw/3)}" fill="${col}"/>`;
    if(b.label){const t=b.label(i); if(t){const tw=String(t).length*5.7+2,cx=x0+bw/2;

      else{const crowd=tw*0.93>step-2,st2=(crowd&&i%2)?10:0,oy=v>=0?yt-8-st2:yt+h+9+st2;lab+=`<text x="${cx}" y="${oy}" text-anchor="middle" dominant-baseline="central" font-size="${crowd?(step<28?8.5:9):10}" font-weight="700" fill="${ink}" stroke="#fff" stroke-width="2.5" paint-order="stroke">${t}</text>`}}}
  }));
  g+=lab;
  (o.lines||[]).forEach(l=>{
    let d='',first=true; l.vals.forEach((v,i)=>{ if(v==null){first=true;return}; d+=(first?'M':'L')+x(i).toFixed(1)+' '+y(v).toFixed(1); first=false;});
    g+=`<path d="${d}" fill="none" stroke="${l.color}" stroke-width="${l.width||2}" ${l.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    l.vals.forEach((v,i)=>{ if(v!=null&&!l.nodots){g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${l.color}" stroke="#fff" stroke-width="2"/>`;
      if(l.label){const t=l.label(i);if(t)g+=`<text x="${x(i)}" y="${y(v)+(((typeof l.above==='function')?l.above(i):l.above)===false?15+((String(t).length*5.4>step-2&&i%2)?10:0):-9-((String(t).length*5.4>step-2&&i%2)?10:0))}" text-anchor="middle" font-size="${step<28?8.5:9.5}" font-weight="700" fill="${l.color}" stroke="#fff" stroke-width="2.5" paint-order="stroke">${t}</text>`}}});
  });

  const cin=el.querySelector('.cin'),svg=el.querySelector('svg'),tip=el.querySelector('.tip'),xh=el.querySelector('.xh');
  let cur=-1;
  const show=i=>{
    xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.style.display='';
    let h=`<b>${o.labels[i]}</b>`;
    [...o.bars.map(b=>[b.name,b.vals[i],b.color,b.tip]),...(o.lines||[]).map(b=>[b.name,b.vals[i],b.color,b.tip])].forEach(([nm,v,c,tp])=>{h+=`<br><span style="color:${c==='#C9C9CE'?'#bbb':c}">●</span> ${nm} ${v==null?'-':(o.tfmt||fm)(v)}${(()=>{const r=tp?tp(i):'';return !r?'':r[0]==='\n'?r.split('\n').slice(1).map(l=>'<br>　<span style="opacity:.9">'+l+'</span>').join(''):' ('+r+')'})()}`});
    tip.innerHTML=h;tip.classList.remove('hide');

    const vs=[...o.bars.map(b=>b.vals[i]),...(o.lines||[]).map(b=>b.vals[i])].filter(v=>v!=null);

  svg.addEventListener('click',ev=>{
    const r=svg.getBoundingClientRect(),i=Math.max(0,Math.min(n-1,Math.floor((ev.clientX-r.left-pl)/step)));
    if(cur===i){hide()}else{show(i);cur=i}
  });
  if(W>avail){el.scrollLeft=el.scrollWidth; const hint=document.createElement('div');hint.className='hint';hint.textContent='← 좌우로 밀어서 전체 월 보기';el.insertAdjacentElement('afterend',hint);}
}

let ACX={},TREE=[],NODE={};
function buildTree(){
  ACX={};ALL.meta.ac.forEach((a,i)=>ACX[a[0]]=i);
  const leaf=(id,l)=>({id:'a_'+id,n:l,ac:id});
  const byP=p=>ALL.meta.ac.filter(a=>a[2]===p).map(a=>leaf(a[0],a[1]));
  const grp=(id,n,p)=>({id,n,k:byP(p)});
  TREE=[
   {id:'cogs',n:'원가',f:'cogs',k:[{id:'c_goods',n:'상품 원가',d:'goods',k:byP('C_goods')},{id:'c_waste',n:'폐기 원가',ac:'C_waste',k:byP('C_waste').map(x=>(x.co=true,x))}]},
   {id:'labor',n:'인건비',f:'labor',k:byP('L')},
   {id:'mfg',n:'제조경비',f:'mfg',k:[grp('m_fee','지급수수료','M_fee'),grp('m_util','수도광열비','M_util'),grp('m_ad','광고비','M_ad'),grp('m_misc','기타 소모품비','M_misc')]},
   {id:'rent',n:'임차료',f:'rent',k:byP('R')},
   {id:'dep',n:'감가상각비',f:'dep'},
   {id:'alloc',n:'본부 관리비',f:'alloc'}];
  NODE={};const walk=(n,par)=>{n.par=par;NODE[n.id]=n;(n.k||[]).forEach(c=>walk(c,n))};TREE.forEach(n=>walk(n,null));
}
function nv(n,f,pr){
  const A=pr?f.pac:f.ac,P=pr?'p':'';
  if(n.f) return f[P+n.f];
  if(n.ac) return A[ACX[n.ac]];
  if(n.d==='goods') return f[P+'cogs']-A[ACX['C_waste']];
  return (n.k||[]).reduce((s,c)=>s+nv(c,f,pr),0);
}

function groupBy(keyf,namef,filt){
  const g={};

    const k=keyf(x.s);const o=g[k]||(g[k]={k,n:namef?namef(k):k,cnt:0,loss:0,rev:0,prev:0,op1:0,op2:0,pop2:0,crev:0,cprev:0,sm:0,cg:0,lb:0,ws:0,at:Object.fromEntries(Object.keys(DLAB).map(k=>[k,{s:0,n:0}])),s0:x.s,list:[]});
    if(x.f.rev!==0){o.cnt++;if(x.f.op2<0)o.loss++;}
    o.sm+=idx().filter(m=>(x.s.r26.rev[m]||0)>0).length;
    o.rev+=x.f.rev;o.prev+=x.f.prev;o.op1+=x.f.op1;o.op2+=x.f.op2;o.pop2+=x.f.pop2;o.cg+=x.f.cogs;o.lb+=x.f.labor;o.ws+=x.f.waste||0;

}
function grpInsight(arr,lb){

  let t=`${lb}별로는 매출 비중 1위가 ${top.n}(${pc(top.rev/T,0)})`;
  if(best) t+=`, 영업이익(2) 이익률 1위가 ${best.n}(${pc(best.op2/best.rev)})`;

}

function renderAn(){
  const a=st.an,hp=D.meta.hasPrev;

  if(!hp){body='<div class="note">이 연도는 비교할 전년 데이터가 없어 특이사항을 산출할 수 없습니다.</div>';}
  else{
    const leaves=[];(function w(ns){ns.forEach(n=>{if(n.k)w(n.k);else leaves.push(n)})})(TREE);
    const set=a.acc==='all'?leaves:[NODE[a.acc]];
    const act=active().filter(x=>isComp(x.s,x.f));
    let hits=[];
    act.forEach(x=>set.forEach(n=>{

    body=`<div class="cnt">단위: 백만원 · 표시 ${hits.length}건 · ${ns}개 매장 · 전년 동기와 비교 가능한 동일점(Comp.s) ${act.length}개 매장 대상</div>`+
      hits.slice(0,a.lim).map((h,i)=>{const f=h.x.f,s=h.x.s;return `<button class="srow an" data-c="${s.c}" data-acc="${h.n.id}"><span class="rk">${i+1}</span><div style="min-width:0"><div class="nm">${esc(sname(s))}</div><div class="mt"><b>${esc(nodePath(h.n))}</b> · 비중 ${pc(h.pr)} → ${pc(h.r)}</div><div class="mt2">매출 ${fm(f.rev)}(${pcs(f.rev/f.prev-1)}) · 영업이익(2) ${fs(f.op2)}(전년 ${fs(f.pop2)}) · 이익률 ${pc(ratio(f.op2,f.rev))}</div></div><div class="rt"><b class="${h.d>0?'dn':'up'}">${pp(h.d)}</b><div>${fm(h.pv)}→${fm(h.v)}</div></div></button>`}).join('')||'<div class="note">조건에 맞는 항목이 없습니다.</div>'
      +(hits.length>a.lim?`<button class="more" id="an-more">더 보기 (${hits.length-a.lim}건 남음)</button>`:'');
  }
  $('#t-an').innerHTML=`
  <div class="filters"><select id="an-acc" class="wide" aria-label="계정"><option value="all" ${a.acc==='all'?'selected':''}>전체 계정 (세부 항목 기준)</option>${opts.map(([v,l])=>`<option value="${v}" ${a.acc===v?'selected':''}>${l}</option>`).join('')}</select></div>
  <div class="pill-row">${[['all','전체'],['up','비용 증가'],['dn','비용 감소']].map(([k,l])=>`<button class="chip" data-andir="${k}" aria-pressed="${a.dir===k}">${l}</button>`).join('')}</div>
  ${head}${body}
  <div class="note">기준: 동일점(Comp.s: 신규·리뉴얼·폐점 제외) 중 계정별 비용을 매출로 나눈 비중이 전년 동기 대비 ±0.5%p 이상 변한 매장입니다. 비용이 늘면 빨강, 줄면 파랑입니다. 항목을 누르면 매장 상세 정보를 볼 수 있습니다. 인건비의 세금공과는 4대보험 기준입니다.</div>`;
  $('#an-acc').addEventListener('change',e=>{a.acc=e.target.value;a.lim=40;renderAn()});
  document.querySelectorAll('[data-andir]').forEach(b=>b.addEventListener('click',()=>{a.dir=b.dataset.andir;a.lim=40;renderAn()}));

}
function fillPeriod(){
  const ys=[...ALL.meta.years].sort((a,b)=>a-b),ly=tlY(LASTT);
  const mo=(y,sel)=>Array.from({length:y===ly?tlM(LASTT):12},(_,i)=>`<option value="${i+1}" ${i+1===sel?'selected':''}>${i+1}월</option>`).join('');
  const yo=sel=>ys.map(y=>`<option value="${y}" ${y===sel?'selected':''}>${y}년</option>`).join('');
  $('#pfy').innerHTML=yo(tlY(st.a));$('#pty').innerHTML=yo(tlY(st.b));
  $('#pfm').innerHTML=mo(tlY(st.a),tlM(st.a));$('#ptm').innerHTML=mo(tlY(st.b),tlM(st.b));
}
function resetSel(){
  Object.assign(st,{rgSel:null,rgSub:null,gFmt:null,rgSub2:null,gSel:null,gRt:null,gSub:null,sel:null,lim:40});
  Object.assign(st.f,{team:'',mgr:'',coh:'',region:'',fmt:'',trade:''});
}
function changePeriod(a,b,fromSide){
  a=Math.max(0,Math.min(a,LASTT));b=Math.max(0,Math.min(b,LASTT));
  if(a>b){if(fromSide==='f')b=a;else a=b}
  st.a=a;st.b=b;setPeriod();fillPeriod();resetSel();render();
}
function init(){
  window.setHH=()=>{const h=document.querySelector('header.top');if(h)document.documentElement.style.setProperty('--hh',h.offsetHeight+'px')};setHH();addEventListener('resize',setHH);setTimeout(setHH,300);
  fillPeriod();
  const rd=()=>({a:(+$('#pfy').value-TL0)*12+(+$('#pfm').value)-1,b:(+$('#pty').value-TL0)*12+(+$('#ptm').value)-1});
  $('#pfy').addEventListener('change',()=>{const r=rd();changePeriod(r.a,r.b,'f')});
  $('#pfm').addEventListener('change',()=>{const r=rd();changePeriod(r.a,r.b,'f')});
  $('#pty').addEventListener('change',()=>{const r=rd();changePeriod(r.a,r.b,'t')});
  $('#ptm').addEventListener('change',()=>{const r=rd();changePeriod(r.a,r.b,'t')});
  $('#m-month').addEventListener('click',()=>changePeriod(st.b,st.b,'t'));
  $('#m-ytd').addEventListener('click',()=>changePeriod(tlS(st.b),st.b,'t'));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>{
    st.tab=b.dataset.t;document.querySelectorAll('nav.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
    document.querySelectorAll('section.tab').forEach(s=>s.classList.toggle('on',s.id==='t-'+st.tab));window.scrollTo(0,0);render();}));
  let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(st.tab==='trend'||st.tab==='sum')render()},150)});
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{if(st.tab==='sum')fitLists()});
  render();
}
</script>
<script>
(function(){const b=document.getElementById('totop'),pn=document.getElementById('pn'),sh=document.getElementById('sheet');
const open=()=>sh.classList.contains('on');
const chk=()=>{const y=open()?pn.scrollTop:window.scrollY;b.classList.toggle('on',y>300)};
window.addEventListener('scroll',chk,{passive:true});pn.addEventListener('scroll',chk,{passive:true});
new MutationObserver(chk).observe(sh,{attributes:true,attributeFilter:['class']});
b.addEventListener('click',()=>{(open()?pn:window).scrollTo({top:0,behavior:'smooth'})});})();
</script>
</body>
