<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --surface-2:#FAFAFA; --surface-3:#F2F2F3;
  --border:#E7E7E9; --border-soft:#F0F0F1;
  --text:#17171A; --text-dim:#58585F; --text-mute:#9A9AA0;
  --accent:#E4002B; --accent-soft:#FFE9EC; --accent-ink:#ffffff;
  --rise:#1656D1; --neg:#E4002B; --info:#1E3A8A; --info-soft:#EDF1FB;
  --s26:#1656D1; --s25:#C9C9CE; --plan:#58585F;
  --c1:#1656D1; --c2:#E4002B; --c3:#0E9F5A; --c4:#E08A00;
  --shadow:0 1px 2px rgba(20,20,25,.04),0 6px 20px rgba(20,20,25,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--accent);color:#fff}
.hide{display:none!important}
/* gate */
#gate{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:14vh 20px 24px}
.gate-card{width:100%;max-width:540px;background:transparent;border:0;padding:0;box-shadow:none;text-align:center}
.brand-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:26px}
.brand-t{font-size:.82rem;font-weight:800;letter-spacing:.14em;color:var(--accent)}
.brand-mark{width:16px;height:40px;border-radius:4px;background:var(--accent);flex-shrink:0}
.gate-card h1{font-size:1.7rem;margin:0 0 14px;font-weight:800;letter-spacing:-.02em}
.gate-card p{margin:0 0 26px;color:var(--text-dim);font-size:1rem}
.pwwrap{position:relative}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:1.05rem;color:var(--text-mute);cursor:pointer;padding:6px}
.gdiv{border:0;border-top:1px solid var(--border);margin:30px 0 22px}
.gate-card input[type=password],.gate-card input#pw{width:100%;height:60px;border:2px solid var(--border);border-radius:16px;padding:0 48px 0 20px;background:#fff;font-size:18px}
.gate-card input[type=password]:focus{outline:none;border-color:var(--accent)}
.gate-card .row{display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 0 6px;color:var(--text-dim);font-size:.82rem}
.btn{width:100%;height:60px;border:0;border-radius:16px;margin-top:12px;background:var(--accent);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
.err{color:var(--neg);font-size:.82rem;min-height:18px;margin-top:8px}
/* shell */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;border-bottom:1px solid var(--border)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top-r{display:flex;align-items:center;gap:8px;flex:none}
.sbtn{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1.5px solid #2a2a2f;border-radius:19px;background:#f6f6f8;cursor:pointer;font-weight:600}
.sbtn em{display:none;font-style:normal;font-size:.82rem;color:var(--text-dim)}
.sbtn:hover{border-color:var(--accent);background:#fff0f2}
@media (min-width:700px){.sbtn{min-width:270px}.sbtn em{display:inline}}
#srch{position:fixed;inset:0;z-index:70}
#srch .sbd{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#srch .spn{position:absolute;left:50%;top:0;transform:translateX(-50%);width:min(640px,100%);max-height:100vh;background:#fff;display:flex;flex-direction:column;border-radius:0 0 18px 18px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
@media (min-width:700px){#srch .spn{top:8vh;border-radius:18px;max-height:80vh}}
.sbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.sbar input{flex:1;min-width:0;height:44px;border:2px solid #2a2a2f;border-radius:12px;padding:0 14px;font-size:16px;background:#fff;-webkit-appearance:none}
.sbar input:focus{outline:none;border-color:var(--accent)}
#sres{overflow:auto;padding:6px 8px 14px}
.sg{font-size:.7rem;font-weight:800;color:var(--text-mute);padding:10px 8px 4px;letter-spacing:.04em}
.sit{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 8px;border-radius:10px;cursor:pointer;border-bottom:1px dashed #e3e3e8}
.sit:hover,.sit.on{background:#fff0f2}

  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  if(typeof DecompressionStream==='undefined'){const e=new Error('nogz');e.code='nogz';throw e}
  const txt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}

  if(remember) lsSet('plpass',pass);

}

// 증감 표기: 율(액). goodUp=true 이면 증가가 이익에 유리, false 이면 비용(증가=불리)
function dl(v,pv,goodUp,rateOnly,stack){
  if(!D.meta.hasPrev) return '<span class="nu">-</span>';
  const d=v-pv,r=pv>0?d/pv:null,good=goodUp?d>0:d<0;
  const c=Math.round(d)===0?'nu':(good?'up':'dn');
  const ar=Math.round(d)>0?'▲':Math.round(d)<0?'▼':'';
  if(stack) return `<span class="${c}">${ar} ${r==null?'-':pcs(r)}</span><span class="s2">(${fs(d)})</span>`;
  return `<span class="${c}">${ar} ${r==null?'-':pcs(r)}${rateOnly?'':` (${fs(d)})`}</span>`;
}
function dpp(a,b,goodUp){
  if(a==null||b==null)return '';const d=a-b,good=goodUp?d>0:d<0;
  return `<span class="${Math.abs(d)<0.0005?'nu':(good?'up':'dn')}">${pp(d)}</span>`;
}
function dpa(r,pr,v,pv,goodUp,stack){
  if(!D.meta.hasPrev||r==null||pr==null) return '<span class="nu">-</span>';
  const d=r-pr,da=v-pv,good=goodUp?d>0:d<0,flat=Math.abs(d)<0.0005;
  const c=flat?'nu':(good?'up':'dn'),ar=flat?'':(d>0?'▲':'▼');
  const a=`(${fs(da)}백만)`;
  return stack?`<span class="${c}">${ar} ${pp(d)}</span><span class="s2">${a}</span>`:`<span class="${c}">${ar} ${pp(d)} ${a}</span>`;
}

/* ---------- chart (grouped bars / lines, horizontal in-bar labels, horizontal scroll if narrow) ---------- */
function chart(el,o){
  // bars:[{name,color,negColor,vals,w,label?(i),tip?(i)}]  lines:[{name,color,vals,dash,width,label?(i),above?}]
  const H=o.h||230,pr=10,pt=14,pb=24;
  const all=[];o.bars.forEach(b=>b.vals.forEach(v=>v!=null&&all.push(v)));(o.lines||[]).forEach(b=>b.vals.forEach(v=>v!=null&&all.push(v)));
  let mx=Math.max(...all,o.nozero?-1e18:0),mn=Math.min(...all,o.nozero?1e18:0); if(!isFinite(mx)){mx=1;mn=0} if(mx===mn)mx=mn+1;
  if(o.nozero){const pad=(mx-mn)*.18;mx+=pad;mn-=pad;}
  const nice=x=>{const p=Math.pow(10,Math.floor(Math.log10(Math.abs(x)||1)));const n=x/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p};
  const span=nice((mx-mn)/4); let top=Math.ceil(mx/span)*span,bot=Math.floor(mn/span)*span; if(top===bot)top+=span;
  const axf=o.axis||fm;
  const pl=Math.max(34,Math.max(axf(top).length,axf(bot).length)*6.4+12);
  const n=o.labels.length,nb=o.bars.length,gap=2;
  const avail=(el.clientWidth||340);
  let ws=o.bars.map(b=>b.w||18),grp=ws.reduce((a,b)=>a+b,0)+Math.max(0,nb-1)*gap;
  const fitStep=(avail-pl-pr)/n;
  if(nb&&n<=12&&fitStep<grp+8){const k=Math.max(.4,(fitStep-6)/grp);ws=ws.map(w=>Math.max(5,w*k));grp=ws.reduce((a,b)=>a+b,0)+Math.max(0,nb-1)*gap;}
  const minStep=nb?Math.min(grp+8,n<=12?fitStep:1e9):Math.min(o.minStep||0,n<=12?fitStep:1e9);
  const W=Math.max(avail,pl+pr+n*minStep);
  const iw=W-pl-pr,ih=H-pt-pb,step=iw/n;
  const y=v=>pt+ih*(1-(v-bot)/(top-bot)),x=i=>pl+step*(i+.5);
  const mute=cssv('--text-mute'),line=cssv('--border'),ink=cssv('--text');
  let g='';
  for(let v=bot;v<=top+1e-9;v+=span){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${Math.abs(v)<1e-9?mute:line}" stroke-width="${Math.abs(v)<1e-9?1:.7}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="${mute}">${axf(v)}</text>`;}
  o.labels.forEach((l,i)=>{g+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle" font-size="${step<28?10:11}" fill="${mute}">${step<28?String(l).replace('월',''):l}</text>`});
  let lab='';
  const y0=y(Math.max(bot,Math.min(0,top)));
  o.bars.forEach((b,bi)=>b.vals.forEach((v,i)=>{ if(v==null)return;
    const off=ws.slice(0,bi).reduce((a,c)=>a+c+gap,0),bw=ws[bi];
    const x0=x(i)-grp/2+off,yt=Math.min(y(v),y0),h=Math.max(1,Math.abs(y(v)-y0));
    const col=(b.negColor&&v<0)?b.negColor:b.color;
    g+=`<rect x="${x0}" y="${yt}" width="${bw}" height="${h}" rx="${Math.min(4,bw/3)}" fill="${col}"/>`;
    if(b.label){const t=b.label(i); if(t){const tw=String(t).length*5.7+2,cx=x0+bw/2;
      if(h>=15&&tw<=bw+2){lab+=`<text x="${cx}" y="${yt+h/2}" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="#fff">${t}</text>`}
      else{const crowd=tw*0.93>step-2,st2=(crowd&&i%2)?10:0,oy=v>=0?yt-8-st2:yt+h+9+st2;lab+=`<text x="${cx}" y="${oy}" text-anchor="middle" dominant-baseline="central" font-size="${crowd?(step<28?8.5:9):10}" font-weight="700" fill="${ink}" stroke="#fff" stroke-width="2.5" paint-order="stroke">${t}</text>`}}}
  }));
  g+=lab;
  (o.lines||[]).forEach(l=>{
    let d='',first=true; l.vals.forEach((v,i)=>{ if(v==null){first=true;return}; d+=(first?'M':'L')+x(i).toFixed(1)+' '+y(v).toFixed(1); first=false;});
    g+=`<path d="${d}" fill="none" stroke="${l.color}" stroke-width="${l.width||2}" ${l.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    l.vals.forEach((v,i)=>{ if(v!=null&&!l.nodots){g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${l.color}" stroke="#fff" stroke-width="2"/>`;
      if(l.label){const t=l.label(i);if(t)g+=`<text x="${x(i)}" y="${y(v)+(((typeof l.above==='function')?l.above(i):l.above)===false?15+((String(t).length*5.4>step-2&&i%2)?10:0):-9-((String(t).length*5.4>step-2&&i%2)?10:0))}" text-anchor="middle" font-size="${step<28?8.5:9.5}" font-weight="700" fill="${l.color}" stroke="#fff" stroke-width="2.5" paint-order="stroke">${t}</text>`}}});
  });
  g+=`<line class="xh" x1="0" x2="0" y1="${pt}" y2="${pt+ih}" stroke="${mute}" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>`;
  el.style.overflowX='auto';
  el.innerHTML=`<div class="cin" style="position:relative;width:${W}px"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.title||'차트')}">${g}</svg><div class="tip hide"></div></div>`;
  const cin=el.querySelector('.cin'),svg=el.querySelector('svg'),tip=el.querySelector('.tip'),xh=el.querySelector('.xh');
  let cur=-1;
  const show=i=>{
    xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.style.display='';
    let h=`<b>${o.labels[i]}</b>`;
    [...o.bars.map(b=>[b.name,b.vals[i],b.color,b.tip]),...(o.lines||[]).map(b=>[b.name,b.vals[i],b.color,b.tip])].forEach(([nm,v,c,tp])=>{h+=`<br><span style="color:${c==='#C9C9CE'?'#bbb':c}">●</span> ${nm} ${v==null?'-':(o.tfmt||fm)(v)}${(()=>{const r=tp?tp(i):'';return !r?'':r[0]==='\n'?r.split('\n').slice(1).map(l=>'<br>　<span style="opacity:.9">'+l+'</span>').join(''):' ('+r+')'})()}`});
    tip.innerHTML=h;tip.classList.remove('hide');
    tip.style.left=Math.max(70,Math.min(W-70,x(i)))+'px';
    const vs=[...o.bars.map(b=>b.vals[i]),...(o.lines||[]).map(b=>b.vals[i])].filter(v=>v!=null);
    tip.style.top=Math.max(y(Math.max(...vs,0))-18,tip.offsetHeight+4)+'px';
  };
  const hide=()=>{tip.classList.add('hide');xh.style.display='none';cur=-1};
  svg.addEventListener('click',ev=>{
    const r=svg.getBoundingClientRect(),i=Math.max(0,Math.min(n-1,Math.floor((ev.clientX-r.left-pl)/step)));
    if(cur===i){hide()}else{show(i);cur=i}
  });
  if(W>avail){el.scrollLeft=el.scrollWidth; const hint=document.createElement('div');hint.className='hint';hint.textContent='← 좌우로 밀어서 전체 월 보기';el.insertAdjacentElement('afterend',hint);}
}

/* ---------- 계정 트리 (상세계정) ---------- */
let ACX={},TREE=[],NODE={};
function buildTree(){
  ACX={};ALL.meta.ac.forEach((a,i)=>ACX[a[0]]=i);
  const leaf=(id,l)=>({id:'a_'+id,n:l,ac:id});
  const byP=p=>ALL.meta.ac.filter(a=>a[2]===p).map(a=>leaf(a[0],a[1]));
  const grp=(id,n,p)=>({id,n,k:byP(p)});
  TREE=[
   {id:'cogs',n:'매출원가',f:'cogs',k:[{id:'c_goods',n:'상품 원가',d:'goods',k:byP('C_goods')},{id:'c_waste',n:'폐기 원가',ac:'C_waste',k:byP('C_waste').map(x=>(x.co=true,x))}]},
   {id:'labor',n:'인건비',f:'labor',k:byP('L')},
   {id:'mfg',n:'제조경비',f:'mfg',k:[grp('m_fee','지급수수료','M_fee'),grp('m_util','수도광열비','M_util'),grp('m_ad','광고비','M_ad'),grp('m_misc','기타 소모품비','M_misc')]},
   {id:'rent',n:'임차료',f:'rent',k:byP('R')},
   {id:'dep',n:'감가상각비',f:'dep'},
   {id:'alloc',n:'본부 관리비',f:'alloc'}];
  NODE={};const walk=(n,par)=>{n.par=par;NODE[n.id]=n;(n.k||[]).forEach(c=>walk(c,n))};TREE.forEach(n=>walk(n,null));
}
function nv(n,f,pr){
  const A=pr?f.pac:f.ac,P=pr?'p':'';
  if(n.f) return f[P+n.f];
  if(n.ac) return A[ACX[n.ac]];
  if(n.d==='goods') return f[P+'cogs']-A[ACX['C_waste']];
  return (n.k||[]).reduce((s,c)=>s+nv(c,f,pr),0);
}

const cntNZ=a=>(a||[]).filter(v=>v).length;

const nM=()=>st.mode==='ytd'?idx().length:0;
function nodeRows(n,depth,c,rev){
  if(!n.k||!st.open.has(n.id)) return '';

    const v=nv(ch,c,false),pv=nv(ch,c,true);

    const r=ratio(v,rev),pr=ratio(pv,c.prev),op=st.open.has(ch.id);

function mval(a,m){return m==='rev'?a.rev:m==='op1'?a.op1:m==='op2'?a.op2:(a.cprev>0?a.crev/a.cprev-1:null)}
function sortG(arr){const m=st.gm;return arr.sort((a,b)=>{const x=mval(a,m),y=mval(b,m);if(x==null&&y==null)return b.rev-a.rev;if(x==null)return 1;if(y==null)return -1;return y-x})}
const compCell=(cr,cp)=>cp>0?`<span class="${gcol(cr/cp-1)}">${pcs(cr/cp-1)}</span>`:'-';
function grpTable(arr,label,pick,kind,avg){
  const T=arr.reduce((o,a)=>{for(const k of ['cnt','loss','rev','prev','op1','op2','pop2','crev','cprev','sm'])o[k]+=a[k];return o},{cnt:0,loss:0,rev:0,prev:0,op1:0,op2:0,pop2:0,crev:0,cprev:0,sm:0});

  <tr class="sum hl"><td>합계</td><td>${T.cnt}</td><td>${fm(T.rev)}</td>${avg?`<td>${avc(T)}</td>`:''}<td>100%</td><td>${dl(T.rev,T.prev,true,true)}</td><td class="${cl(T.op1)}">${fs(T.op1)}</td><td class="${cl(T.op2)}">${fs(T.op2)}</td><td>${pc(ratio(T.op2,T.rev),1)}</td><td>${compCell(T.crev,T.cprev)}</td><td>${T.loss}</td></tr>
  ${arr.map((a,i)=>(a.cnt===0&&a.rev===0)?'':`<tr class="${kind?'clk':''} ${pick===a.k?'pick':''}" ${kind?`data-k="${esc(a.k)}"`:''}><td>${esc(a.n)}<div class="bar"><i style="width:${Math.max(2,mv[i]/mx*100)}%"></i></div></td><td>${a.cnt}</td><td>${fm(a.rev)}</td>${avg?`<td>${avc(a)}</td>`:''}<td>${pc(ratio(a.rev,T.rev),1)}</td><td>${dl(a.rev,a.prev,true,true)}</td><td class="${cl(a.op1)}">${fs(a.op1)}</td><td class="${cl(a.op2)}">${fs(a.op2)}</td><td>${pc(ratio(a.op2,a.rev),1)}</td><td>${compCell(a.crev,a.cprev)}</td><td>${a.loss}</td></tr>`).join('')}</table></div>`;
}
function groupBy(keyf,namef,filt){
  const g={};
  D.stores.filter(s=>!filt||filt(s)).map(s=>({s,f:sfig(s)})).filter(x=>x.f.rev!==0||x.f.op2!==0||x.f.prev!==0).forEach(x=>{
    const k=keyf(x.s);const o=g[k]||(g[k]={k,n:namef?namef(k):k,cnt:0,loss:0,rev:0,prev:0,op1:0,op2:0,pop2:0,crev:0,cprev:0,sm:0,s0:x.s,list:[]});
    if(x.f.rev!==0){o.cnt++;if(x.f.op2<0)o.loss++;}
    o.sm+=idx().filter(m=>(x.s.r26.rev[m]||0)>0).length;
    o.rev+=x.f.rev;o.prev+=x.f.prev;o.op1+=x.f.op1;o.op2+=x.f.op2;o.pop2+=x.f.pop2;
    if(isComp(x.s,x.f)){o.crev+=x.f.rev;o.cprev+=x.f.prev}
    o.list.push(x);
  });
  return Object.values(g);
}
function grpInsight(arr,lb){
  if(!arr.length) return '';
  const T=arr.reduce((s,a)=>s+a.rev,0),top=arr.slice().sort((a,b)=>b.rev-a.rev)[0];
  const ok=arr.filter(a=>a.cnt>=2&&a.rev>0),best=ok.slice().sort((a,b)=>b.op2/b.rev-a.op2/a.rev)[0];
  const g=D.meta.hasPrev?arr.filter(a=>a.cprev>0&&a.cnt>=2).sort((a,b)=>b.crev/b.cprev-a.crev/a.cprev)[0]:null;
  let t=`${lb}별로는 매출 비중 1위가 ${top.n}(${pc(top.rev/T,0)})`;
  if(best) t+=`, 영업이익(2) 이익률 1위가 ${best.n}(${pc(best.op2/best.rev)})`;
  if(g) t+=`, Comp.s 성장 1위가 ${g.n}(${pcs(g.crev/g.cprev-1)})`;
  return t+'입니다.';
}

function renderRg(){
  const lv=st.rgLevel,filt=s=>s.region!=='기타'&&s.region!=='폐점'&&s.region!=='미분류';
  const kfs={gw:s=>s.gw,region:s=>s.region,sg:s=>s.sg?`${s.region} ${s.sg}`:s.region};
  const LB={gw:'권역',region:'시·도',sg:'시·군·구'};
  const chain={gw:['gw','region','sg'],region:['region','sg'],sg:['sg']}[lv];
  const OR=['서울','경기','부산','대구','인천','광주','대전','울산','충북','충남','전북','전남','경북','경남','제주','강원','세종'],oi=r=>{const i=OR.indexOf(r);return i<0?99:i};
  const order=(arr,key)=>{if(key==='sg') return arr.sort((x,y)=>(oi(x.s0.region)-oi(y.s0.region))||(x.s0.sg||'').localeCompare(y.s0.sg||'','ko'));
    if(key==='region'&&chain.length>1&&chain[0]==='gw') return arr.sort((x,y)=>oi(x.k)-oi(y.k)); return sortG(arr)};
  const arr=order(groupBy(kfs[lv],null,filt),lv);
  const T=arr.reduce((a,b)=>a+b.rev,0);
  const cap=groupBy(s=>s.gw,null,filt).find(a=>a.k==='수도권');
  const lb=LB[lv];
  const sels=[null,null,null],tabs=[arr];
  const sel0=st.rgSel&&arr.find(a=>a.k===st.rgSel)?st.rgSel:null;sels[0]=sel0;
  const want=[st.rgSel,st.rgSub,st.rgSub2];
  for(let i=1;i<chain.length&&sels[i-1];i++){
    const prev=sels.slice(0,i);
    const ai=order(groupBy(kfs[chain[i]],null,s=>filt(s)&&prev.every((v,j)=>kfs[chain[j]](s)===v)),chain[i]);
    tabs[i]=ai; sels[i]=want[i]&&ai.find(x=>x.k===want[i])?want[i]:null;
  }
  const g=sel0?arr.find(a=>a.k===sel0):null;
  let panel='';
  if(g){
    let extra='';
    for(let i=1;i<tabs.length;i++){
      if(!tabs[i]) break;
      extra+=`<h3 class="sh">${LB[chain[i]]}별 <small>${esc(sels[i-1])}에 포함된 ${LB[chain[i]]} · 누르면 아래 목록이 좁혀집니다</small></h3><div class="insight">${grpInsight(tabs[i],LB[chain[i]])}</div><div class="card flat">${grpTable(tabs[i],LB[chain[i]],sels[i],'rg'+i,true)}</div>`;
    }
    const act=sels.filter(Boolean);
    const list=g.list.filter(x=>act.every((v,j)=>kfs[chain[j]](x.s)===v));
    panel=listPanel(`${lb} ${act.join(' › ')}`,list,extra);
  }
  $('#t-rg').innerHTML=`
  <div class="pill-row">${[['gw','권역'],['region','시·도'],['sg','시·군·구']].map(([k,l])=>`<button class="chip" data-lv="${k}" aria-pressed="${lv===k}">${l}</button>`).join('')}</div>
  ${lv==='sg'?'':gmSel()}
  <div class="cnt">${per()} · 지역별 · 단위: 백만원(VAT 별도)${cap?` · 수도권 매출 비중 ${pc(cap.rev/T,0)}`:''} · 행을 누르면 ${lv==='gw'?'시·도·시·군·구별 현황과 ':lv==='region'?'시·군·구별 현황과 ':''}매장 목록</div>
  <div class="insight">${grpInsight(arr,lb)}</div>
  <div class="card">${grpTable(arr,lb,sel0,'rg',true)}</div>
  ${panel}
  <div class="note">${GNOTE} 지역은 엠즈씨드 점포정보의 시·도, 시, 구(군) 기준이며 서울·광역시는 구, 그 외는 시·군 단위입니다. 점당 월평균은 영업 중인 매장·월 기준 평균 매출입니다. 시·군·구는 시·도 순서(서울, 경기, 부산, 대구, 인천, 광주, 대전, 울산, 충북, 충남, 전북, 전남, 경북, 경남, 제주, 그 외) 다음 가나다순입니다. 지역 정보가 없는 폐점·행사점은 집계에서 제외해 합계가 전사 매출보다 작을 수 있습니다.</div>`;
  document.querySelectorAll('[data-lv]').forEach(b=>b.addEventListener('click',()=>{st.rgLevel=b.dataset.lv;st.rgSel=st.rgSub=st.rgSub2=null;renderRg()}));
  if($('#gm'))$('#gm').addEventListener('change',e=>{st.gm=e.target.value;renderRg()});
  document.querySelectorAll('#t-rg table[data-kind=rg] tr[data-k]').forEach(r=>r.addEventListener('click',()=>{st.rgSel=st.rgSel===r.dataset.k?null:r.dataset.k;st.rgSub=st.rgSub2=null;renderRg();if(st.rgSel)goPanel()}));
  document.querySelectorAll('#t-rg table[data-kind=rg1] tr[data-k]').forEach(r=>r.addEventListener('click',()=>keepY(()=>{st.rgSub=st.rgSub===r.dataset.k?null:r.dataset.k;st.rgSub2=null;renderRg()})));
  document.querySelectorAll('#t-rg table[data-kind=rg2] tr[data-k]').forEach(r=>r.addEventListener('click',()=>keepY(()=>{st.rgSub2=st.rgSub2===r.dataset.k?null:r.dataset.k;renderRg()})));
  const x=$('#selp-x');if(x)x.addEventListener('click',()=>{st.rgSel=st.rgSub=st.rgSub2=null;renderRg()});
  fitLists();
}

/* ---------- 특이사항 ---------- */
function nodePath(n){const p=[];for(let x=n;x;x=x.par)p.unshift(x.n);return p.join(' › ')}
function renderAn(){
  const a=st.an,hp=D.meta.hasPrev;
  const opts=[];(function w(ns,d){ns.forEach(n=>{opts.push([n.id,'　'.repeat(d)+n.n]);if(n.k)w(n.k,d+1)})})(TREE,0);
  let body='',head='';
  if(!hp){body='<div class="note">이 연도는 비교할 전년 데이터가 없어 특이사항을 산출할 수 없습니다.</div>';}
  else{
    const leaves=[];(function w(ns){ns.forEach(n=>{if(n.k)w(n.k);else leaves.push(n)})})(TREE);
    const set=a.acc==='all'?leaves:[NODE[a.acc]];
    const act=active().filter(x=>isComp(x.s,x.f));
    let hits=[];
    act.forEach(x=>set.forEach(n=>{
      const v=nv(n,x.f,false),pv=nv(n,x.f,true),r=v/x.f.rev,pr=pv/x.f.prev,d=r-pr;
      if(Math.abs(d)>=0.005) hits.push({x,n,v,pv,r,pr,d});
    }));
    const up=hits.filter(h=>h.d>0).length,dn=hits.length-up;
    if(a.dir==='up') hits=hits.filter(h=>h.d>0); else if(a.dir==='dn') hits=hits.filter(h=>h.d<0);
    hits.sort((p,q)=>Math.abs(q.d)-Math.abs(p.d));
    const ns=new Set(hits.map(h=>h.x.s.c)).size;
    head=`<div class="insight">${per()} 기준 전년 동기 대비 비용 비중이 ±0.5%p 이상 달라진 항목은 ${(up+dn).toLocaleString('ko-KR')}건(증가 ${up.toLocaleString('ko-KR')} · 감소 ${dn.toLocaleString('ko-KR')})입니다${hits.length?`, 가장 크게 변한 곳은 ${esc(sname(hits[0].x.s))}의 ${esc(hits[0].n.n)}(${pp(hits[0].d)})입니다`:''}.</div>`;
    body=`<div class="cnt">단위: 백만원 · 표시 ${hits.length}건 · ${ns}개 매장 · 전년 동기와 비교 가능한 동일점(Comp.s) ${act.length}개 매장 대상</div>`+
      hits.slice(0,a.lim).map((h,i)=>{const f=h.x.f,s=h.x.s;return `<button class="srow an" data-c="${s.c}" data-acc="${h.n.id}"><span class="rk">${i+1}</span><div style="min-width:0"><div class="nm">${esc(sname(s))}</div><div class="mt"><b>${esc(nodePath(h.n))}</b> · 비중 ${pc(h.pr)} → ${pc(h.r)}</div><div class="mt2">매출 ${fm(f.rev)}(${pcs(f.rev/f.prev-1)}) · 영업이익(2) ${fs(f.op2)}(전년 ${fs(f.pop2)}) · 이익률 ${pc(ratio(f.op2,f.rev))}</div></div><div class="rt"><b class="${h.d>0?'dn':'up'}">${pp(h.d)}</b><div>${fm(h.pv)}→${fm(h.v)}</div></div></button>`}).join('')||'<div class="note">조건에 맞는 항목이 없습니다.</div>'
      +(hits.length>a.lim?`<button class="more" id="an-more">더 보기 (${hits.length-a.lim}건 남음)</button>`:'');
  }
  $('#t-an').innerHTML=`
  <div class="filters"><select id="an-acc" class="wide" aria-label="계정"><option value="all" ${a.acc==='all'?'selected':''}>전체 계정 (세부 항목 기준)</option>${opts.map(([v,l])=>`<option value="${v}" ${a.acc===v?'selected':''}>${l}</option>`).join('')}</select></div>
  <div class="pill-row">${[['all','전체'],['up','비용 증가'],['dn','비용 감소']].map(([k,l])=>`<button class="chip" data-andir="${k}" aria-pressed="${a.dir===k}">${l}</button>`).join('')}</div>
  ${head}${body}
  <div class="note">기준: 동일점(Comp.s: 신규·리뉴얼·폐점 제외) 중 계정별 비용을 매출로 나눈 비중이 전년 동기 대비 ±0.5%p 이상 변한 매장입니다. 비용이 늘면 빨강, 줄면 파랑입니다. 항목을 누르면 매장 상세 정보를 볼 수 있습니다. 인건비의 세금공과는 4대보험 기준입니다.</div>`;
  $('#an-acc').addEventListener('change',e=>{a.acc=e.target.value;a.lim=40;renderAn()});
  document.querySelectorAll('[data-andir]').forEach(b=>b.addEventListener('click',()=>{a.dir=b.dataset.andir;a.lim=40;renderAn()}));
  const m=$('#an-more');if(m)m.addEventListener('click',()=>{a.lim+=40;renderAn()});
}

function storeCostHTML(f,c,mode,hl){
  const vis=n=>(n.k||[]).filter(x=>!x.co);
  const rows=(ns,depth)=>ns.map(n=>{
    const v=nv(n,f,false),cv=mode==='yoy'?nv(n,f,true):nv(n,c,false),a=ratio(v,f.rev),b=ratio(cv,mode==='yoy'?f.prev:c.rev);
    if(depth>0&&Math.abs(v)<0.5&&Math.abs(cv)<0.5) return '';
    const kids=vis(n),ex=kids.length>0,op=st.openS.has(n.id);
    const last=mode==='yoy'?`<td>${dpp(a,b,false)}</td><td class="${v-cv>0.04?'dn':v-cv<-0.04?'up':'nu'}">${D.meta.hasPrev?fs(v-cv):'-'}</td>`:`<td>${dpp(a,b,false)}</td>`;
    return `<tr class="${depth?'sub d'+depth:''}${ex?' clk':''}${hl===n.id?' hit':''}" ${ex?`data-snode="${n.id}"`:''}><td>${esc(n.n)}${ex?' '+caret(op):''}</td><td>${fm(v)}</td><td>${pc(a)}</td><td>${pc(b)}</td>${last}</tr>`+(ex&&op?rows(kids,depth+1):'');
  }).join('');
  const hd=mode==='yoy'?'<th></th><th>금액<br>(백만원)</th><th>비중</th><th>전년 비중</th><th>전년 比<br>(%p)</th><th>전년 比<br>(액, 백만원)</th>':'<th></th><th>금액<br>(백만원)</th><th>매장</th><th>전사</th><th>차이</th>';
  return `<table><tr>${hd}</tr>${rows(TREE,0)}</table>`;
}
function openStore(code,acc,mode){
  const s=D.stores.find(x=>x.c===code);if(!s)return;
  if(acc&&NODE[acc]){let q=NODE[acc].par;while(q){st.openS.add(q.id);q=q.par}}
  const f=sfig(s),c=comp(),M=st.m;
  const kp=(l,v,sub,col)=>`<div class="card kpi"><div class="label">${l}</div><div class="value ${col?(v>0?'up':v<0?'dn':''):''}">${fm(v)}<small>백만</small></div><div class="sub">${sub}</div></div>`;
  const gC=compG(s,f);
  $('#pn').innerHTML=`<div class="hd"><div><h3>${esc(sname(s))}</h3><small>${esc(s.c)} · ${esc(s.trade)} · ${esc(s.fmt)} · ${esc(s.region)}${s.sg?' '+esc(s.sg):''} · ${esc(s.coh||'')}${s.tm?' · '+esc(s.tm):''}${s.mgr?' · 관할 '+esc(s.mgr):''}${gC!=null?` · Comp.s ${pcs(gC)}`:''}</small></div><button class="icon-btn" id="close" aria-label="닫기">✕</button></div>

  ${kp('영업이익(1)',f.op1,`<span>비중 ${pc(ratio(f.op1,f.rev))}</span><span>전년비 ${dl(f.op1,f.pop1,true)}</span>`,1)}
  ${kp('영업이익(2)',f.op2,`<span>비중 ${pc(ratio(f.op2,f.rev))}</span><span>전년비 ${dl(f.op2,f.pop2,true)}</span>${f.plan_op2?`<span>계획 ${fm(f.plan_op2)} · 차이 ${fs(f.op2-f.plan_op2)}</span>`:''}`,1)}
  ${kp('EBITDA(2)',f.ebitda2,`<span>비중 ${pc(ratio(f.ebitda2,f.rev))}</span><span>전년비 ${dl(f.ebitda2,f.pebitda2,true)}</span>`,1)}</div>
  <div id="d-box"></div>
  <h2>비용 구조<small>매출 대비 · ${mode==='yoy'?'전년 동기와 비교':'전사 평균과 비교'} · 항목을 누르면 상세계정</small></h2><div class="card" id="s-cost"></div>`;
  const drawCost=()=>{$('#s-cost').innerHTML=`<div class="scroll-x">${storeCostHTML(f,c,mode,acc)}</div>`;
    document.querySelectorAll('#s-cost tr[data-snode]').forEach(r=>r.addEventListener('click',()=>{const id=r.dataset.snode;st.openS.has(id)?st.openS.delete(id):st.openS.add(id);drawCost()}))};
  drawCost();
  $('#sheet').classList.add('on');document.body.style.overflow='hidden';
  trendUI($('#d-box'),srcStore(s,M),'d');
  $('#close').addEventListener('click',closeSheet);
}

  push('화면','이익 추이','추이 · 영업이익 EBITDA 이익률',()=>{goTab('trend');later('#t-pf')},'영업이익 ebitda 에비타');
  push('화면','매출 및 목표 달성','추이 · 월별 매출',()=>{goTab('trend');later('#t-rev')},'매출 계획 달성');
  [['매출액','rev'],['매출원가','cogs'],['인건비','labor'],['제조경비','mfg'],['임차료','rent'],['감가상각비','dep'],['영업이익(1)','op1'],['본부 관리비','alloc'],['영업이익(2)','op2'],['EBITDA(2)','ebitda2']].forEach(([l,k])=>push('손익 계정',l,'요약 · 손익 구조',()=>{goTab('sum');later('#n-'+k)},k==='cogs'?'원가':k==='alloc'?'본부관리비 안분':k==='op1'?'영업이익':k==='op2'?'영업이익':k==='ebitda2'?'에비타':''));
  Object.values(NODE).forEach(n=>{if(n.co===undefined||true){const path=nodePath(n);push('손익 계정',n.n,path,()=>{goTab('sum');let q=n.par;while(q){st.open.add(q.id);q=q.par}render();later('#n-'+n.id)},path)}});
  const seen=new Set();
  const add=(g,key,label,sub,go)=>{const id=g+key;if(!key||seen.has(id))return;seen.add(id);push(g,label,sub,go)};
  D.stores.forEach(s=>{
    add('권역',s.gw,s.gw,'지역별 · 권역',()=>{goTab('rg');Object.assign(st,{rgLevel:'gw',rgSel:s.gw,rgSub:null,gFmt:null,rgSub2:null});render();later('#selp')});
    add('시·도',s.region,s.region,'지역별 · 시·도',()=>{goTab('rg');Object.assign(st,{rgLevel:'region',rgSel:s.region,rgSub:null,gFmt:null,rgSub2:null});render();later('#selp')});
    if(s.sg)add('시·군·구',s.region+s.sg,`${s.region} ${s.sg}`,'지역별 · 시·군·구',()=>{goTab('rg');Object.assign(st,{rgLevel:'sg',rgSel:`${s.region} ${s.sg}`,rgSub:null,gFmt:null,rgSub2:null});render();later('#selp')});
    add('구분',s.fmt,s.fmt,'구분별 · 상권1',()=>{goTab('grp');Object.assign(st,{dim:'fmt',gSel:s.fmt,gRt:null,gSub:null,gFmt:null});render();later('#selp')});
    add('구분',s.trade,s.trade,'구분별 · 상권2',()=>{goTab('grp');Object.assign(st,{dim:'trade',gSel:s.trade,gRt:null,gSub:null,gFmt:null});render();later('#selp')});
    if(s.mgr)add('구분',s.mgr,s.mgr,'구분별 · 관할',()=>{goTab('grp');Object.assign(st,{dim:'mgr',gSel:s.mgr,gRt:null,gSub:null,gFmt:null});render();later('#selp')});
    if(s.coh)add('구분',s.coh,s.coh,'구분별 · 오픈연도',()=>{goTab('grp');Object.assign(st,{dim:'coh',gSel:s.coh,gRt:null,gSub:null,gFmt:null});render();later('#selp')});
    const rt=retailer(s);if(rt)add('구분','rt'+rt,rt,'구분별 · 인샵 유통사',()=>{goTab('grp');Object.assign(st,{dim:'fmt',gSel:'인샵',gRt:rt,gSub:null,gFmt:null});render();later('#selp')});
  });
  D.stores.filter(s=>sfig(s).rev!==0||s.r26.rev.some(v=>v)).forEach(s=>push('매장',sname(s),`${s.c} · ${s.fmt} · ${s.trade} · ${s.region}${s.sg?' '+s.sg:''}`,()=>{openStore(s.c)},s.c));
  return L;
}
let SIDX=null,SCUR=[];
function renderSearch(q){
  const nq=q.replace(/\s/g,'').toLowerCase(),box=$('#sres');
  if(!SIDX)SIDX=buildSearch();
  let r;
  if(!nq){r=SIDX.filter(x=>['화면','손익 계정'].includes(x.g)&&(x.sub.indexOf('›')<0)).slice(0,14)}
  else{r=SIDX.map(x=>({x,sc:x.l.replace(/\s/g,'').toLowerCase().startsWith(nq)?0:x.l.replace(/\s/g,'').toLowerCase().includes(nq)?1:x.kw.includes(nq)?2:9})).filter(o=>o.sc<9).sort((a,b)=>a.sc-b.sc).map(o=>o.x)}
  const cap={'매장':12};const cnt={};r=r.filter(x=>{cnt[x.g]=(cnt[x.g]||0)+1;return cnt[x.g]<=(cap[x.g]||6)}).slice(0,40);
  SCUR=r;let g='',h='';
  r.forEach((x,i)=>{if(x.g!==g){g=x.g;h+=`<div class="sg">${esc(g)}</div>`}h+=`<button class="sit${i===0?' on':''}" data-i="${i}"><i>${esc(x.g)}</i><span><b>${esc(x.l)}</b><small>${esc(x.sub)}</small></span></button>`});
  box.innerHTML=h||'<div class="sno">검색 결과가 없습니다. 매장명, 원가·인건비 같은 계정, 지역·상권 이름으로 검색해 보세요.</div>';
}
function openSearch(){SIDX=null;$('#srch').classList.remove('hide');document.body.style.overflow='hidden';const i=$('#sq');i.value='';renderSearch('');setTimeout(()=>i.focus(),30)}
function closeSearch(){$('#srch').classList.add('hide');document.body.style.overflow=($('#sheet').classList.contains('on')?'hidden':'')}
function runSearch(i){const x=SCUR[i];if(!x)return;closeSearch();$('#sheet').classList.remove('on');document.body.style.overflow='';x.go()}
$('#sbtn').addEventListener('click',openSearch);
$('#sx').addEventListener('click',closeSearch);
$('#srch .sbd').addEventListener('click',closeSearch);
$('#sq').addEventListener('input',e=>renderSearch(e.target.value));
$('#sq').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runSearch(0)}if(e.key==='Escape')closeSearch()});
$('#sres').addEventListener('click',e=>{const b=e.target.closest('.sit');if(b)runSearch(+b.dataset.i)});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&!$('#app').classList.contains('hide')){e.preventDefault();openSearch()}});

/* ---------- shell ---------- */
function render(){
  $('#m-month').setAttribute('aria-pressed',st.mode==='month');$('#m-ytd').setAttribute('aria-pressed',st.mode==='ytd');
  document.querySelectorAll('#months .chip').forEach(b=>{const on=+b.dataset.m===st.m;b.setAttribute('aria-pressed',on);if(on&&b.scrollIntoView)b.scrollIntoView({inline:'center',block:'nearest'})});
  $('#per-title').textContent='· '+(st.mode==='month'?`${st.m}월 실적`:`1~${st.m}월 누적`);
  $('#asof').textContent=`${D.meta.year}년 ${D.meta.month}월 기준 · 단위: 백만원(VAT 별도)`;
  ({sum:renderSum,trend:renderTrend,grp:renderGrp,rg:renderRg,store:renderStore,an:renderAn})[st.tab]();
}
function buildMonths(){
  const M=D.meta.month;st.m=M;
  $('#months').innerHTML=Array.from({length:M},(_,i)=>`<button class="chip" data-m="${i+1}" aria-pressed="${i+1===M}">${i+1}월</button>`).join('');
  $('#months').scrollLeft=0;
}
function init(){
  const setHH=()=>{const h=document.querySelector('header.top');if(h)document.documentElement.style.setProperty('--hh',h.offsetHeight+'px')};setHH();addEventListener('resize',setHH);setTimeout(setHH,300);
  const ys=[...ALL.meta.years].sort((a,b)=>b-a);
  $('#yr').innerHTML=ys.map(y=>`<option value="${y}" ${y===D.meta.year?'selected':''}>${y}년</option>`).join('');
  $('#yr').addEventListener('change',e=>{setYear(+e.target.value);Object.assign(st,{rgSel:null,rgSub:null,gFmt:null,rgSub2:null,gSel:null,gRt:null,gSub:null,gFmt:null,sel:null,lim:40});Object.assign(st.f,{team:'',mgr:'',coh:'',region:'',fmt:'',trade:''});st.an.lim=40;buildMonths();render()});
  buildMonths();
  $('#months').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;st.m=+b.dataset.m;st.lim=40;render()});
  $('#m-month').addEventListener('click',()=>{st.mode='month';render()});
  $('#m-ytd').addEventListener('click',()=>{st.mode='ytd';render()});
  document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>{
    st.tab=b.dataset.t;document.querySelectorAll('nav.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
    document.querySelectorAll('section.tab').forEach(s=>s.classList.toggle('on',s.id==='t-'+st.tab));window.scrollTo(0,0);render();}));
  let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(st.tab==='trend'||st.tab==='sum')render()},150)});
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{if(st.tab==='sum')fitLists()});
  render();
}
</script>
